<!DOCTYPE html>
<html lang='en' data-bs-theme='dark'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Burnout Clock!</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel='stylesheet' href='assets/css/burnout.css'>
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png?v=20260808" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg?v=20260808" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico?v=20260808" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png?v=20260808" />
    <meta name="apple-mobile-web-app-title" content="Burnout Clock!" />
    <link rel="manifest" href="assets/favicon/site.webmanifest?v=20260808" />
</head>

<body>
    <main class='min-vh-100 d-flex align-items-center justify-content-center p-3'>
        <div class='container-fluid content-container px-0'>
            <div id='setup' class='card ratio ratio-1x1 shadow-lg d-none'>
                <div class='card-body d-flex flex-column align-items-center justify-content-center gap-2'>
                    <div
                        class='flex-grow-1 overflow-hidden w-100 d-flex align-items-center justify-content-center'>
                        <img src='assets/img/burnout-clock.png'
                            class='img-fluid w-100 h-100 object-fit-contain d-block mx-auto user-select-none'
                            width='1200' height='600' alt='Burnout Clock' draggable='false'>
                    </div>
                    <form class='flex-shrink-0 w-100 d-flex flex-column gap-2'>
                        <div>
                            <label for='task-name' class='form-label'>Task Name</label>
                            <input type='text' class='form-control' id='task-name' data-bs-toggle='tooltip'
                                data-bs-title='For your records!'>
                        </div>
                        <div>
                            <label for='task-length' class='form-label'>Anticipated Task Length (hours)</label>
                            <input type='number' class='form-control' id='task-length' min='1' max='12' step='1'
                                data-bs-toggle='tooltip' data-bs-title='The number of hours you anticipate billing!'>
                        </div>
                        <div>
                            <label for='depressed-o-meter'
                                class='form-label d-flex justify-content-between align-items-baseline gap-3 w-100'>
                                <span>Depressed-O-Meter</span>
                                <output id='depressed-o-meter-value' class='text-end' for='depressed-o-meter'
                                    aria-live='polite'>Decent.</output>
                            </label>
                            <input type='range' class='form-range' id='depressed-o-meter' min='0' max='4' step='1'
                                value='2' aria-valuetext='Decent.'>
                        </div>
                        <button type='submit' class='btn btn-primary'>Start Task</button>
                    </form>
                </div>
            </div>
            <div id='work' class='card ratio ratio-1x1 shadow-lg d-none'>
                <div class='card-body d-flex flex-column align-items-center justify-content-center gap-2'>
                    <div
                        class='flex-grow-1 overflow-hidden w-100 d-flex align-items-center justify-content-center'>
                        <img src='assets/img/work.png'
                            class='img-fluid w-100 h-100 object-fit-contain d-block mx-auto user-select-none'
                            width='1200' height='600' alt='Work' draggable='false'>
                    </div>
                    <div class='flex-shrink-0 w-100 d-flex flex-column gap-2'>
                        <h1 class='card-title text-center mb-0'>You're on the clock!</h1>
                        <p class='card-text text-center mb-0'>Time to get to work! This time will be counted as
                            billable, so be as productive as possible!</p>
                        <button type='button' class='btn btn-primary' data-bs-toggle='tooltip'
                            data-bs-title='If you need to use the bathroom or step away for a moment'>I Need a Short
                            Break</button>
                        <button type='button' class='btn btn-primary' data-bs-toggle='tooltip'
                            data-bs-title="If you've completed all your work">I'm Done With This Task</button>
                    </div>
                </div>
            </div>
            <div id='play' class='card ratio ratio-1x1 shadow-lg'>
                <div class='card-body d-flex flex-column align-items-center justify-content-center gap-2'>
                    <div
                        class='flex-grow-1 overflow-hidden w-100 d-flex align-items-center justify-content-center'>
                        <img src='assets/img/play.png'
                            class='img-fluid w-100 h-100 object-fit-contain d-block mx-auto user-select-none'
                            width='1200' height='600' alt='Play' draggable='false'>
                    </div>
                    <div class='flex-shrink-0 w-100 d-flex flex-column gap-2'>
                        <h1 class='card-title text-center mb-0'>You're off the clock!</h1>
                        <p class='card-text text-center mb-0'>Take some time to yourself, but don't go too far! A
                            sound will play when it's time to get back to work. Aim to be back by %TIME%!</p>
                        <button type='button' class='btn btn-primary' data-bs-toggle='tooltip'
                            data-bs-title='If you were really in the zone, you can go back to work early!'>Back to
                            Work</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js'></script>
    <script src='assets/js/tooltips.js'></script>
    <script src='assets/js/burnout.js'></script>
</body>

</html>
