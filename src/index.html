<!DOCTYPE html>
<html lang='en' data-bs-theme='dark'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Burnout Clock!</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel='stylesheet' href='assets/css/burnout.css'>
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png?v=20260808" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg?v=20260808" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico?v=20260808" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png?v=20260808" />
    <meta name="apple-mobile-web-app-title" content="Burnout Clock!" />
    <link rel="manifest" href="assets/favicon/site.webmanifest?v=20260808" />
</head>

<body>
    <main class='min-vh-100 d-flex align-items-center justify-content-center p-3'>
        <div class='container-fluid content-container px-0'>
            <div class='card ratio ratio-1x1 shadow-lg'>
                <div class='card-body d-flex flex-column align-items-center justify-content-center gap-4'>
                    <img src='assets/img/burnout-clock.png' class='img-fluid w-100 d-block mx-auto' width='1200'
                        height='600' alt='Burnout Clock'>
                    <form class='w-100 d-flex flex-column gap-3'>
                        <div>
                            <label for='task-name' class='form-label'>Task Name</label>
                            <input type='text' class='form-control' id='task-name'>
                        </div>
                        <div>
                            <label for='task-length' class='form-label'>Anticipated Task Length (hours)</label>
                            <input type='number' class='form-control' id='task-length' min='1' max='12' step='1'>
                        </div>
                        <button type='submit' class='btn btn-primary'>Start Task</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
