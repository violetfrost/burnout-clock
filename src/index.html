<!DOCTYPE html>
<html lang='en' data-bs-theme='dark'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Burnout Clock!</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel='stylesheet' href='assets/css/burnout.css'>
</head>
<body>
    <main class='min-vh-100 d-flex align-items-center justify-content-center p-3'>
        <div class='container-fluid content-container px-0'>
            <div class='card ratio ratio-1x1 shadow-lg'>
                <div class='card-body d-flex align-items-center justify-content-center'>
                    <form class='w-100 d-flex flex-column gap-4'>
                        <div>
                            <label for='task-name' class='form-label'>Task Name</label>
                            <input type='text' class='form-control' id='task-name'>
                        </div>
                        <div>
                            <label for='task-length' class='form-label'>Anticipated Task Length (hours)</label>
                            <input type='number' class='form-control' id='task-length' min='1' max='12' step='1'>
                        </div>
                        <button type='submit' class='btn btn-primary'>Start Task</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
